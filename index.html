<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#10233b" />
  <meta name="description" content="GUT | Apontador de Produção — interface de produção com dados no Supabase" />
  <title>GUT | Apontador de Produção</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Menu principal">
      <div class="brand">
        <img class="gut-sidebar-logo" src="gut-logo.svg" alt="GUT Consultoria e Treinamentos" />
        <button id="closeMenu" class="icon-button close-menu" aria-label="Fechar menu">×</button>
      </div>
      <div class="sidebar-label">PLATAFORMA</div>
      <nav class="nav" id="nav">
        <button class="nav-link active" data-page="lancamentos"><span class="nav-ico">▤</span><span>Apontamentos</span></button>
        <button class="nav-link" data-page="tv"><span class="nav-ico">▣</span><span>Painel para TV</span></button>
        <button class="nav-link" data-page="funcionarios"><span class="nav-ico">♙</span><span>Funcionários</span></button>
        <button class="nav-link" data-page="estrutura"><span class="nav-ico">▥</span><span>Estrutura da fábrica</span></button>
        <button class="nav-link" data-page="produtos"><span class="nav-ico">▧</span><span>Produtos e operações</span></button>
        <button class="nav-link" data-page="niveis"><span class="nav-ico">↗</span><span>Níveis e tempos</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-label">AMBIENTE</div>
      <nav class="nav nav-bottom"><button class="nav-link" data-page="config"><span class="nav-ico">⚙</span><span>Configurações</span></button></nav>
      <div class="sidebar-status"><span class="live-dot"></span><div><b>Supabase conectado</b><small>Cadastros e apontamentos sincronizados</small></div></div>
      <div class="sidebar-footer">GUT • Tecnologia para o chão de fábrica</div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="topbar-left"><button id="openMenu" class="icon-button mobile-menu" aria-label="Abrir menu">☰</button><div class="breadcrumb">GUT / <strong id="breadcrumb">Apontamentos</strong></div></div>
        <div class="topbar-right"><span class="env-chip"><span class="live-dot"></span> SUPABASE</span><div class="topbar-divider"></div><button type="button" class="btn btn-ghost" data-action="sair" title="Encerrar sessão">Sair</button><div class="avatar" title="Ambiente conectado ao Supabase">G</div></div>
      </header>
      <main id="content" class="content" aria-live="polite"></main>
      <footer class="footer">Apontador de Produção • Sistema conectado <span id="footerDate"></span> • Supabase • Dados sincronizados</footer>
    </div>
  </div>
  <div id="overlay" class="overlay hidden" aria-hidden="true"></div>
  <div id="modal" class="modal-wrap hidden" role="presentation"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.1" defer></script>
  <script src="supabase-bridge.js" defer></script>
  <script src="tv-dashboard.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
